name: Compatibility Check

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  compatibility:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']
        laravel-version: ['^10.0', '^11.0']
        exclude:
          - php-version: '8.1'
            laravel-version: '^11.0'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, exif, iconv
        coverage: xdebug
    
    - name: Check PHP version
      run: php -v
    
    - name: Install dependencies with Laravel ${{ matrix.laravel-version }}
      run: |
        composer require --no-update "laravel/framework:${{ matrix.laravel-version }}"
        composer update --prefer-dist --no-interaction --no-progress
    
    - name: Run PHPUnit tests
      run: vendor/bin/phpunit
