name: CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1']
        laravel-version: ['^10.0']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, exif, iconv
        coverage: xdebug
    
    - name: Check PHP version
      run: php -v
    
    - name: Validate composer.json
      run: composer validate --strict
    
    - name: Cache Composer dependencies
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-
    
    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
    
    - name: Check dependencies security
      run: |
        composer require --dev roave/security-advisories:dev-latest
    
    - name: Run PHP CS Fixer
      run: vendor/bin/php-cs-fixer fix --dry-run --diff
    
    - name: Run PHPStan
      run: vendor/bin/phpstan analyse
    
    - name: Run PHPUnit tests
      run: XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-text
    
    - name: Check compatibility with Laravel ${{ matrix.laravel-version }}
      run: |
        composer require --no-update "laravel/framework:${{ matrix.laravel-version }}"
        composer update --prefer-dist --no-interaction --no-progress
